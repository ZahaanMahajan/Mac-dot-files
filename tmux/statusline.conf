# vim: ft=tmux
set -g mode-style "fg=#c0caf5,bg=#1f2335"

set -g message-style "fg=#c0caf5,bg=#1f2335"
set -g message-command-style "fg=#c0caf5,bg=#1f2335"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#a9b1d6,bg=#1a1b26"
set -g status-bg "#1a1b26"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style none
set -g status-right-style none

# LEFT STATUS: session + username
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7] #S #[fg=#7aa2f7,bg=#bb9af7,nobold,nounderscore,noitalics]#[fg=#1a1b26,bg=#bb9af7] #(whoami) #[fg=#bb9af7,bg=#1a1b26]"

# RIGHT STATUS: hostname
set -g status-right "#[fg=#565f89,bg=#1a1b26,nobold,nounderscore,noitalics]#[fg=#394b70,bg=#565f89]#[fg=#414868,bg=#565f89,nobold,nounderscore,noitalics]#[fg=#394b70,bg=#414868]#[fg=#394b70,bg=#414868,nobold,nounderscore,noitalics]#[fg=#c0caf5,bg=#394b70] #h "

setw -g window-status-activity-style "underscore,fg=#7aa2f7,bg=#1a1b26"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#a9b1d6,bg=#1a1b26"

setw -g window-status-format '#[fg=#1a1b26,bg=#1a1b26]#[default] #I  #{b:pane_current_path} #[fg=#1a1b26,bg=#1a1b26,nobold,nounderscore,noitalics]'

setw -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7] #I #[fg=#7aa2f7,bg=#394b70] #{b:pane_current_path} #[fg=#394b70,bg=#1a1b26,nobold]'

